# Copy this to config.toml and edit it.  (config.toml is git-ignored: it holds your webhook/bot tokens.)

interval = 600          # seconds between scans. Keep >= 300 or you'll get rate-limited/blocked.
db_path = "deals.db"

# Applied to every [[watch]] below unless the watch overrides it.
[defaults]
steal_ratio = 0.65      # steal = price <= 65% of the market price. Lower = fewer, better alerts.
min_ratio = 0.15        # anything under 15% of market is ignored (scams, broken, "box only", accessories)
min_samples = 8         # listings needed before the automatic market estimate is trusted
history_days = 45       # how far back the market estimate looks
# Titles matching any of these (case-insensitive, whole words, regex allowed) are ignored.
# Per-watch `exclude` lists are ADDED to this one.
exclude = [
  "broken", "faulty", "for parts", "parts only", "not working", "doesn'?t work", "cracked",
  "box only", "empty box", "icloud", "locked", "blacklisted", "replica", "fake", "wanted", "looking for",
  # Lithuanian - swap these for your language
  "sugedęs", "sugedusi", "neveikia", "neveikiantis", "dalims", "tik dėžutė", "ieškau", "perku",
]

[vinted]
enabled = true
domain = "www.vinted.lt"   # your country's site: vinted.lt, vinted.lv, vinted.pl, vinted.co.uk, vinted.de, vinted.fr ...
currency = "EUR"

[marketplace]
enabled = false            # set true after running: python -m dealtracker fb-login
location = "vilnius"       # the bit after /marketplace/ in the URL when you browse your area
radius_km = 40
days_since_listed = 1      # only look at fresh listings
currency = "EUR"
headless = true

[notify]
console = true
discord_webhook = ""       # Server Settings -> Integrations -> Webhooks -> Copy URL
telegram_bot_token = ""    # from @BotFather
telegram_chat_id = ""      # message your bot, then open https://api.telegram.org/bot<token>/getUpdates
ntfy_url = ""              # e.g. https://ntfy.sh/some-long-random-topic-name (free phone push, no account)

# ---------------------------------------------------------------------------------------------
# What to watch. min_price/max_price are the SEARCH WINDOW (keep it generous so the market
# estimate is realistic, but set min_price high enough that cases/cables/games for the product
# fall below it - that's a better accessory filter than excluding words like "case", which would
# also hide "PS5 + case + 2 games" bundles). Use target_price for "ping me if anything is under X".
#   require      = every pattern must appear in the title (stops "RTX 3060" showing up for 3070)
#   exclude      = extra junk words for this watch
#   market_price = set your own fair price instead of the automatic median
#   sources      = ["vinted"], ["marketplace"], or both (default)
#   vinted_params = extra raw Vinted API filters, e.g. { catalog_ids = "2994" }
# ---------------------------------------------------------------------------------------------

[[watch]]
name = "RTX 3070"
query = "rtx 3070"
require = ["3070"]
exclude = ["ti", "laptop", "nešiojamas"]
min_price = 60
max_price = 500

[[watch]]
name = "RTX 3080"
query = "rtx 3080"
require = ["3080"]
exclude = ["laptop", "nešiojamas"]
min_price = 100
max_price = 700

[[watch]]
name = "PS5"
query = "ps5"
require = ["ps5|playstation 5"]
min_price = 150
max_price = 600

[[watch]]
name = "Steam Deck"
query = "steam deck"
require = ["steam ?deck"]
min_price = 150
max_price = 700

[[watch]]
name = "iPhone 14 Pro"
query = "iphone 14 pro"
require = ["14 ?pro"]
exclude = ["max"]
min_price = 250
max_price = 1100
# target_price = 350       # always ping at or under this, even before the market estimate exists

[[watch]]
name = "MacBook M1/M2"
query = "macbook air m1"
require = ["macbook", "m[12]\\b"]
min_price = 250
max_price = 1400
